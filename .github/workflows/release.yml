name: Release

# Push a tag like v0.1.0 to build MelCat.exe on Windows and publish it as a
# GitHub Release. The tag must match the workspace version in Cargo.toml.
# The exe that is published first passes scripts/smoke-test.ps1 on the
# runner's desktop; its 'exe' step also checks that the version info in
# crates/app/resources/app.rc and the manifest's version in app.manifest are
# that version, so bump all three together.
# Run it manually (Actions > Release > Run workflow) for a dry run that builds,
# smoke-tests and packages without publishing anything, even from a tag:
# only a pushed tag publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -ne "v$version") {
              Write-Error "Tag $tag does not match the workspace version v$version in Cargo.toml."
              exit 1
            }
          }
          Write-Host "MelCat $version"

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p melcat

      # The exe that is published, end to end on the runner's desktop. A
      # failure stops the job before anything is packaged or published.
      - name: Smoke test
        shell: powershell
        run: .\scripts\smoke-test.ps1 -Exe target\release\MelCat.exe -ArtifactsDir smoke-artifacts

      - name: Upload smoke artifacts (log, desktop screenshots, summary)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ github.sha }}
          path: smoke-artifacts
          retention-days: 14
          if-no-files-found: warn

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist/MelCat-$v-windows-x64.exe"
          Copy-Item target/release/MelCat.exe $exe
          Compress-Archive -Path target/release/MelCat.exe, README.md, LICENSE -DestinationPath "dist/MelCat-$v-windows-x64.zip"
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload packages (all runs)
        uses: actions/upload-artifact@v6
        with:
          name: MelCat-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        # Only a pushed tag publishes; a manual run is a dry run even from a tag.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          ## Download

          Get **MelCat-${{ steps.version.outputs.version }}-windows-x64.exe** below and run it. No installer: MelCat lives in the tray (bottom-right, near the clock). To start it with Windows, choose **Launch at Login** in its tray menu.

          Windows SmartScreen may warn that the app is unrecognized, because it is not code-signed yet: click **More info**, then **Run anyway**. The `.zip` holds the same exe with the README and the license, and `SHA256SUMS.txt` lists the checksums.

          Requires Windows 10 version 1607 or later, or Windows 11, x64. ARM64 PCs with Windows 11 run it through x64 emulation; Windows 10 on ARM cannot run it.
          "@
          gh release create $tag dist/* --title "MelCat $tag" --notes $notes --generate-notes --verify-tag
